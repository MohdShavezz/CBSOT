<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container div{
            display: flex;
            height: 5rem;
            gap: 1rem;

        }
        .top,
        .second,
        .third, .fourth,.fourth-one, .fourth-two {
            display: flex;
        }
        

        .top div {
            border: 1px solid;
            background-color: orange;
            width: 100%;
        }

        .second div {
            border: 1px solid;
            background-color: green;
            width: 100%;
        }

        .third div {
            border: 1px solid;
            background-color: rgb(51, 56, 182);
            width: 100%;
        }

        .fourth div {
            border: 1px solid;
            background-color: rgb(126, 127, 155);
            width: 100%;
            min-width: 5rem;
        }

        @media screen and (max-width:768px) {

            .top,
            .third,.fourth {
                flex-direction: column;
            }


        }
        @media screen and (max-width:320px) {

            .fourth-one,.fourth-two{
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <h2>Layout</h2>
    <div id="container">
        <div class="top">
            <div class="one">1</div>
            <div class="two">2</div>
        </div>
        <div class="second">
            <div>3</div>
        </div>
        <div class="third">
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>
        <div class="fourth">
            <div class="fourth-one">
                <div>7</div>
                <div>8</div>
            </div>
            <div class="fourth-two">
                <div>9</div>
                <div>10</div>
            </div>
        </div>
    </div>
</body>

</html>
