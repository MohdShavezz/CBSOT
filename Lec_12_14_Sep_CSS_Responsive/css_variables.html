<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            /* global variable */
            --my-favorite-color:rgb(108, 235, 110);
        }
        h2{
            color:var(--my-favorite-color);
        }
        p{
            color: var(--my-favorite-color);
        }

        .box{
            /* local variable */
             --your-fav-color:rgb(61, 119, 176);
        }
        span{
            color: var(--your-fav-color);
        }
        footer{
            /* local variable cant access */
            color: var(--your-fav-color);
            /* gloabl variable can access */
            color: var(--my-favorite-color);

        }
    </style>
</head>
<body>
    <h2>CSS variable</h2>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Delectus voluptatibus iure, repellendus fugit minus dolores animi accusamus! Consequatur, velit hic.</p>
    <div class="box" style="background: yellow;">
        this is box
        <span style="background: red;">
            this is span inside box
        </span>
    </div>
    <footer>
        this is footer
    </footer>
</body>
</html>
